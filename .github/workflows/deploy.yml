name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify Backend
        working-directory: backend
        run: |
          npm ci
          npm test --if-present
          npm run build --if-present

      - name: Verify Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test --if-present
          npm run lint --if-present
          npm run build

  deploy-backend:
    name: Deploy Backend
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ vars.AZURE_ACR_NAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build & Push Image
        working-directory: backend
        run: |
          IMAGE_BASE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/${{ vars.AZURE_CONTAINER_APP }}"
          docker build --platform linux/amd64 \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            -t "$IMAGE_BASE:latest" .
          docker push --all-tags "$IMAGE_BASE"

  deploy-frontend:
    name: Deploy Frontend
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Load SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FRONTEND_VM_SSH_PRIVATE_KEY }}

      - name: Deploy to Nginx
        env:
          VM_USER: ${{ secrets.FRONTEND_VM_USER }}
        working-directory: frontend
        run: |
          mkdir -p ~/.ssh && ssh-keyscan -H "${{ vars.AZURE_FRONTEND_HOST }}" >> ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh "$VM_USER@${{ vars.AZURE_FRONTEND_HOST }}" '
            rm -rf ~/opendeals-dist && mkdir -p ~/opendeals-dist &&
            tar -xzf - -C ~/opendeals-dist &&
            sudo rm -rf /var/www/html/* &&
            sudo cp -r ~/opendeals-dist/. /var/www/html/ &&
            sudo chown -R www-data:www-data /var/www/html &&
            sudo chmod -R 755 /var/www/html &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          '